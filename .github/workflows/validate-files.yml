name: Check File Integrity

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  check-integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML files
        shell: bash
        run: |
          set -euo pipefail

          echo "🔍 Scanning current HTML files for integrity..."
          echo ""

          failed=0
          total=0

          shopt -s nullglob
          files=( *.html )

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "❌ No HTML files found"
            exit 1
          fi

          for file in "${files[@]}"; do
            case "$file" in
              google*.html|BingSiteAuth.html|yandex_*.html)
                echo "Skipping: $file (site-verification stub)"
                continue
                ;;
            esac

            total=$((total + 1))
            echo "Checking: $file"

            if [[ ! -s "$file" ]]; then
              echo "  ✗ File is empty"
              failed=$((failed + 1))
              continue
            fi

            if ! grep -qi '<!doctype html' "$file"; then
              echo "  ⚠ Missing or malformed doctype"
            fi

            if ! grep -qi '</html>' "$file"; then
              echo "  ✗ Missing closing </html> tag"
              failed=$((failed + 1))
              continue
            fi

            if ! grep -qi 'charset' "$file"; then
              echo "  ⚠ Missing charset declaration"
            fi

            size=$(wc -c < "$file")

            if [[ "$size" -lt 2000 ]]; then
              echo "  ⚠ Warning: file is small (${size} bytes)"
            else
              echo "  ✓ OK (${size} bytes)"
            fi
          done

          echo ""
          echo "Summary: Checked $total files, $failed issues found"

          if [[ "$failed" -gt 0 ]]; then
            echo "❌ File integrity check failed"
            exit 1
          fi

          echo "✅ All current HTML files passed integrity checks"
