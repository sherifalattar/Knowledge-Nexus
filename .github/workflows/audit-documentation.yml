name: Audit Documentation Completeness

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run weekly audit on Mondays at 09:00 UTC
    - cron: '0 9 * * 1'

jobs:
  audit-documentation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Verify all modules exist
        run: |
          echo "📋 Auditing Knowledge Nexus documentation completeness..."
          echo ""
          
          # All modules documented in README.md
          declare -a modules=(
            "index.html|Cinematic Opening"
            "pyramids.html|The Pyramids"
            "observatory.html|The Observatory"
            "drgs-compendium.html|DRGs Compendium"
            "denial-codes.html|Denial Codes"
            "denial-codes-semantic.html|Denial Navigator"
            "psychiatry-intro.html|Psychiatry — A Triangulated Lens"
            "psychiatry-semantic-layer.html|Psychiatry — Semantic Layer"
            "psychiatry-ir-drg-tree.html|Psychiatry across DSM-5 & IR-DRG"
            "setting-of-care.html|Setting-of-Care Principles"
            "source-corpus.html|Source Corpus"
            "gallery.html|Gallery"
            "executive-summary.html|About the Author"
          )
          
          missing=0
          found=0
          
          for entry in "${modules[@]}"; do
            IFS='|' read -r file name <<< "$entry"
            if [ -f "$file" ]; then
              echo "✓ $file — $name"
              found=$((found + 1))
            else
              echo "✗ MISSING: $file — $name"
              missing=$((missing + 1))
            fi
          done
          
          echo ""
          echo "Results: $found found, $missing missing"
          
          if [ $missing -gt 0 ]; then
            echo ""
            echo "⚠️  Documentation audit found gaps:"
            echo "   - $missing module(s) are referenced but not found"
            echo "   - Check README.md for inconsistencies"
            exit 1
          fi
          
          echo ""
          echo "✅ All documented modules are present"
          
      - name: Check README consistency
        run: |
          echo ""
          echo "🔍 Spot-checking README references..."
          
          # Verify README mentions the modules we just found
          if grep -q "Inside the Nexus" README.md; then
            echo "✓ README.md found"
            if grep -q "Source Corpus" README.md; then
              echo "✓ Module table found"
            else
              echo "⚠ Module table may have changed - review README.md"
            fi
          else
            echo "⚠ README.md structure unclear"
          fi
