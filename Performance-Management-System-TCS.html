  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

child(2){text-align:left}\ntable.pv td{padding:2.4mm 0;border-bottom:1px solid rgba(255,255,255,.07);text-align:right;\n  font-family:var(--mono);font-size:8.5pt;font-variant-numeric:tabular-nums;color:var(--ink2)}\ntable.pv td:first-child{text-align:left;font-family:var(--sans);color:var(--ink1);font-weight:500;font-size:8.9pt;padding-right:4mm;line-height:1.3}\ntable.pv td:nth-child(2){text-align:left;color:var(--ink3);font-size:8pt;padding-right:3mm;line-height:1.35}\ntable.pv td:nth-child(4),table.pv td:nth-child(5){white-space:nowrap}\ntable.pv td:nth-child(4){padding-left:5mm}\ntable.pv td:nth-child(5){padding-left:4mm}\ntable.pv tr:last-child td{border-bottom:0}\ntable.pv td.h{color:var(--spec2);letter-spacing:.02em}\n.ib{font-family:var(--mono);font-size:6pt;letter-spacing:.1em;color:var(--gold);\n  border:1px solid var(--gold-dim);border-radius:2px;padding:.4mm 1.4mm;margin-left:1.8mm}\n.stamp{display:flex;justify-content:space-between;align-items:center;gap:5mm;\n  margin-top:3.4mm;padding-top:3mm;border-top:1px solid rgba(255,255,255,.14)}\n.stamp span{font-family:var(--mono);font-size:8.1pt;color:var(--ink3);line-height:1.5}\n.stamp b{color:var(--gold-br);font-weight:500}\n.stamp .v{font-family:var(--mono);font-size:6.8pt;letter-spacing:.22em;color:var(--gold-br);\n  border:1px solid var(--gold-soft);border-radius:2px;padding:1.4mm 3mm;flex:none;\n  box-shadow:0 0 10px rgba(198,163,90,.22)}\n\n\n/* ===== annotation rail ===== */\n.band{display:grid;grid-template-columns:31mm 1fr;gap:6.2mm;align-items:start}\n.band + .band{margin-top:4.4mm}\n.ann{padding-top:.8mm;border-top:1px solid rgba(255,255,255,.14)}\n.ann .k{display:block;font-family:var(--mono);font-size:6.9pt;letter-spacing:.2em;\n  text-transform:uppercase;margin:2.2mm 0 1.6mm;color:var(--ink4)}\n.ann .x{display:block;font-family:var(--sans);font-size:8.6pt;line-height:1.46;color:var(--ink3)}\n.ann.val{border-top-color:var(--gold-soft)}      .ann.val .k{color:var(--gold-br)}\n.ann.prov{border-top-color:var(--spec2)}         .ann.prov .k{color:var(--spec2)}\n.ann.con{border-top-color:var(--cyan-soft)}      .ann.con .k{color:var(--cyan)}\n.ann.cyc{border-top:1px dashed var(--gold-soft)} .ann.cyc .k{color:var(--gold-br)}\n.ann .fig{display:block;font-family:var(--display);font-weight:700;font-size:14pt;\n  letter-spacing:-.015em;line-height:1.05;margin-bottom:1.4mm;color:var(--spec)}\n.ann.val .fig{color:var(--gold-br)}\n\n.foot{margin-top:auto;padding-top:3.6mm;border-top:1px solid var(--ls);\n  display:flex;justify-content:space-between;align-items:flex-end}\n.foot .who{font-family:var(--mono);font-size:7.8pt;letter-spacing:.16em;text-transform:uppercase;color:var(--ink4)}\n.foot .pg{font-family:var(--mono);font-size:7.8pt;letter-spacing:.16em;color:var(--gold)}\n\n/* ===== dossier frame ===== */\n.corner{position:absolute;width:7mm;height:7mm;border:1.2px solid rgba(198,163,90,.4);pointer-events:none;z-index:3}\n.corner.c1{top:7mm;left:6mm;border-right:0;border-bottom:0}\n.corner.c2{top:7mm;right:6mm;border-left:0;border-bottom:0}\n.corner.c3{bottom:7mm;left:6mm;border-right:0;border-top:0}\n.corner.c4{bottom:7mm;right:6mm;border-left:0;border-top:0}\n.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:6mm}\n.stamp2{font-family:var(--mono);font-size:7.2pt;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-br);\n  border:1px solid var(--gold-soft);border-radius:2px;padding:1.3mm 3mm;flex:none;white-space:nowrap}\n\n/* ===== tweaks: palette ===== */\nhtml[data-palette=\"warm\"] .page{background:\n  radial-gradient(74% 44% at 86% -8%, rgba(72,52,24,.55) 0%, transparent 60%),\n  radial-gradient(60% 38% at -8% 102%, rgba(198,163,90,.16) 0%, transparent 62%),\n  linear-gradient(180deg,#120D08 0%,#0D0A07 56%,#070504 100%)}\nhtml[data-palette=\"warm\"]{--gold:#D8AE5E;--gold-br:#F3D9A0;--cyan:#22B8D6}\nhtml[data-palette=\"contrast\"]{--ink1:#FFFFFF;--ink2:#E9ECF3;--ink3:#B8C1D4;--gold:#E8C46E;--gold-br:#FBE7B0;--cyan:#20D6F2}\nhtml[data-palette=\"contrast\"] .page{background:linear-gradient(180deg,#000000 0%,#050708 60%,#000000 100%)}\n\n/* ===== tweaks: card material ===== */\nhtml[data-cards=\"forged\"] .glass,html[data-cards=\"forged\"] .glass-deep{\n  background:linear-gradient(177deg,#35435A 0%,#2A3648 22%,#202936 46%,#171D26 72%,#0C1015 100%);\n  backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid rgba(255,255,255,.14);\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.17),inset 0 -1px 0 rgba(0,0,0,.72),0 22px 48px -32px rgba(0,0,0,.95)}\nhtml[data-cards=\"outline\"] .glass,html[data-cards=\"outline\"] .glass-deep{\n  background:rgba(255,255,255,.012);backdrop-filter:none;-webkit-backdrop-filter:none;\n  border:1px solid rgba(198,163,90,.4);border-radius:2px;box-shadow:none}\n\n/* ===== tweaks: layout density ===== */\nhtml[data-density=\"spacious\"] .page{padding:14mm 13mm 10mm}\nhtml[data-density=\"spacious\"] .band{grid-template-columns:32mm 1fr;gap:6.6mm}\nhtml[data-density=\"spacious\"] .band+.band{margin-top:5.4mm}\nhtml[data-density=\"spacious\"] h2{font-size:20.5pt;margin:3.6mm 0 4.2mm}\nhtml[data-density=\"spacious\"] p{line-height:1.68}\nhtml[data-density=\"spacious\"] .stats{margin:4.6mm 0}\nhtml[data-density=\"spacious\"] .byline{margin-top:5.5mm}\n\n/* ===== tweaks panel ===== */\n.tweaks-panel{position:fixed;top:16px;right:16px;z-index:999;background:rgba(10,16,24,.92);\n  border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:12px 14px;width:190px;\n  font-family:\"JetBrains Mono\",monospace;backdrop-filter:blur(10px);box-shadow:0 20px 44px -20px rgba(0,0,0,.8)}\n.tw-head{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#6B7688;margin-bottom:10px}\n.tw-group{margin-bottom:10px}\n.tw-group:last-child{margin-bottom:0}\n.tw-label{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#9AA7BD;margin-bottom:5px}\n.tw-seg{display:flex;flex-direction:column;gap:3px}\n.tw-seg button{font-family:inherit;font-size:9.5px;letter-spacing:.03em;text-align:left;background:transparent;\n  border:1px solid rgba(255,255,255,.12);color:#9AA7BD;border-radius:3px;padding:5px 8px;cursor:pointer;transition:all .15s}\n.tw-seg button.on{border-color:rgba(198,163,90,.55);color:#E6CD92;background:rgba(198,163,90,.08)}\n.tw-seg button:hover{color:#DCE3EE}\n@media print{.tweaks-panel{display:none}}\n\n/* collapsible: default collapsed to a small toggle, so the fixed panel never overlaps the centred page */\n.tw-toggle{position:fixed;top:16px;right:16px;z-index:1000;font-family:\"JetBrains Mono\",monospace;\n  font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:#9AA7BD;\n  background:rgba(10,16,24,.92);border:1px solid rgba(255,255,255,.14);border-radius:6px;\n  padding:7px 10px;cursor:pointer;backdrop-filter:blur(10px)}\n.tw-toggle:hover{color:#E6CD92;border-color:rgba(198,163,90,.5)}\n.tweaks-panel{display:none}\n.tweaks-panel.open{display:block;top:52px}\n@media print{.tw-toggle{display:none}.tweaks-panel{display:none}}\n\n/* page 5 (departmental output) carries three exhibits — scoped tightening, no copy removed */\n.pout h2{margin:1.4mm 0 1.8mm}\n.pout .band + .band{margin-top:1.8mm}\n.pout .tnote{margin-top:1.2mm;line-height:1.38}\n.pout .cyc-tables table{font-size:8.4pt}\n.pout .cyc-tables th{font-size:6.6pt;letter-spacing:.05em;padding-bottom:1.1mm;line-height:1.25}\n.pout .cyc-tables td{padding:1.1mm 0;font-size:8.4pt}\n.pout .cyc-tables td:first-child{font-size:8.2pt}\n\n.pout .cyc-tables th + th,.pout .cyc-tables td + td{padding-left:1.4mm}\n.pout .cyc-tables{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}\n.pout .cyc-tables table{width:100%}\n.pout .cyc-tables th:first-child,.pout .cyc-tables td:first-child{width:31%}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n\n<section class=\"page\">\n  <div class=\"corner c1\"><\u002Fdiv><div class=\"corner c2\"><\u002Fdiv><div class=\"corner c3\"><\u002Fdiv><div class=\"corner c4\"><\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-start\">\n    <div class=\"org\">Total Care Saudi &nbsp;·&nbsp; Roving Doctors Department &nbsp;·&nbsp; 2022–2024<\u002Fdiv>\n    <img class=\"mono-mark\" alt=\"SA\" src=\"acb64571-e360-4de8-a4b3-3336877812af\">\n  <\u002Fdiv>\n\n  <div class=\"plate\" style=\"margin-top:3.4mm\">\n    <span class=\"steelmark hero\">PERFORMANCE<\u002Fspan>\n    <span class=\"steelmark hero\">MANAGEMENT SYSTEM<\u002Fspan>\n    <span class=\"sub\">set up 13 Nov 2022 &nbsp;·&nbsp; declared 17 Jan 2023<\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"lede\" style=\"margin-top:3.4mm\">A department built from zero, and the instrument that measured it —\n  <em>standardisation before measurement, and a loop that closes on its own author.<\u002Fem><\u002Fdiv>\n\n  <div class=\"byline\">\n    <div><div class=\"k\">Built<\u002Fdiv><div class=\"v\">Function · job description · process · data pipeline · measurement<\u002Fdiv><\u002Fdiv>\n    <div><div class=\"k\">Authorship<\u002Fdiv><div class=\"v\">Sole — design, formulation, Power BI build<\u002Fdiv><\u002Fdiv>\n    <div><div class=\"k\">Team<\u002Fdiv><div class=\"v\">6 physicians across KSA — never more than 3 at once<\u002Fdiv><\u002Fdiv>\n    <div><div class=\"k\">Repository<\u002Fdiv><div class=\"v\">OneNote hub — 436 MB, 8 linked sections<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"stats\">\n    <div class=\"stat glass\"><div class=\"n\">10<\u002Fdiv><div class=\"c\">Payer portfolios<br>9 private + GOSI<br>Cigna added 2023<\u002Fdiv><\u002Fdiv>\n    <div class=\"stat glass\"><div class=\"n\">4<\u002Fdiv><div class=\"c\">Regions<br>Central · Western · Eastern · Madinah<\u002Fdiv><\u002Fdiv>\n    <div class=\"stat glass\"><div class=\"n\">5<\u002Fdiv><div class=\"c\">Savings categories<br>a closed taxonomy<\u002Fdiv><\u002Fdiv>\n    <div class=\"stat glass\"><div class=\"n\"><small>SAR <\u002Fsmall><span class=\"g\">20<\u002Fspan><small>M<\u002Fsmall><\u002Fdiv><div class=\"c\">Documented savings<br>7,195 roving visits<br>2,913 lives touched<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"hrow\"><div class=\"eyebrow\">00 &nbsp;—&nbsp; The problem before the metric<\u002Fdiv><div class=\"stamp2\">Foundational<\u002Fdiv><\u002Fdiv>\n  <h2>Five judgements are not a measurement<\u002Fh2>\n\n  <div class=\"band\"><div class=\"ann con\"><span class=\"k\">Concept<\u002Fspan><span class=\"x\">Variance between assessors is the first enemy. Standardisation is what converts it from noise into signal.<\u002Fspan><\u002Fdiv><div><p>Five physicians auditing across the Kingdom, each on their own internal standard, produce a <b>non-linear by-product<\u002Fb> — decisions that cannot be ranked, defended or audited against one another. No metric laid over that measures anything real.<\u002Fp><p style=\"margin-top:3mm\">So the first build was not a metric. It was a <b>shared reference frame<\u002Fb>: regulatory law, payer policy and clinical guidelines in one repository, with SOPs written over them. Not because any guideline set was optimal — because standardisation had to become a mindset before variance could read as performance.<\u002Fp><p style=\"margin-top:3mm\">The book of work was ten portfolios — GOSI on the public side, and ACIG, Buruj, Arabian Shield, Al Etihad, Al Sagr, UCA and GGI among the private payers. Cigna International entered the Saudi market during 2023, while the department was running.<\u002Fp><\u002Fdiv><\u002Fdiv>\n\n  <div class=\"foot\">\n    <div class=\"who\">Dr. Sherif Alattar &nbsp;·&nbsp; Founding Head, Roving Doctors Department<\u002Fdiv>\n    <div class=\"pg\">01 / 08<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- ============ THE FIVE LAYERS ============ -->\n<section class=\"page\">\n  <div class=\"corner c1\"><\u002Fdiv><div class=\"corner c2\"><\u002Fdiv><div class=\"corner c3\"><\u002Fdiv><div class=\"corner c4\"><\u002Fdiv>\n  <div class=\"sec\"><span class=\"id\">00 · B<\u002Fspan><span class=\"nm\">The order of construction<\u002Fspan><span class=\"ds\">each layer makes the next possible<\u002Fspan><\u002Fdiv>\n  <p style=\"max-width:178mm;margin-bottom:6mm\">The department was established at the request of the private payers, who wanted auditors inside the hospitals rather than claims reviewed after the fact. It was declared on <b>17 January 2023<\u002Fb>. The nine weeks before it — from <b>13 November 2022<\u002Fb> — were operational and technical set-up: new software deployed, physicians brought from across the Kingdom to Khobar for on-the-job training I delivered myself, alongside the reference frame, the process, the job description and the data pipeline. All of it built before there was a department to measure. I did not select the team — they were assigned to me, as their caseloads later were, which is part of why the instrument had to be fair to whoever arrived. I was recruited out of Bupa Arabia — where the roving-doctor function originated in the Middle East — by the preauthorisation manager, and reported to <b>Dr Faisal Al Otaibi<\u002Fb>, Medical Director. Six physicians passed through in all, never more than three at once. The remit began as recommendation only — approval stayed with pre-authorisation — and widened to full authority in stages, because the department was new, the software was a constraint, and a payer’s physician deciding inside a hospital drew real pressure before it drew acceptance. The sequence below is not a diagram of intent; it is the order the work happened in.<\u002Fp><p style=\"max-width:178mm;margin-bottom:10mm\">Nothing here could be built out of sequence. A metric laid over unstandardised judgement measures noise; a pipeline over an undefined process counts the wrong things. Each layer exists because the one above it was already in place.<\u002Fp>\n\n\n  <div class=\"cap\" style=\"margin-top:5mm\">Five layers · each one makes the next possible<\u002Fdiv>\n  <svg viewBox=\"0 0 700 178\" style=\"width:100%;height:auto\">\n    <defs>\n      <linearGradient id=\"stq\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n        <stop offset=\"0\" stop-color=\"#35435A\"><\u002Fstop><stop offset=\".34\" stop-color=\"#2A3648\"><\u002Fstop>\n        <stop offset=\".72\" stop-color=\"#171D26\"><\u002Fstop><stop offset=\"1\" stop-color=\"#0C1015\"><\u002Fstop><\u002FlinearGradient>\n      <linearGradient id=\"spec\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n        <stop offset=\"0\" stop-color=\"rgba(220,227,238,0)\"><\u002Fstop><stop offset=\".5\" stop-color=\"rgba(220,227,238,.36)\"><\u002Fstop>\n        <stop offset=\"1\" stop-color=\"rgba(220,227,238,0)\"><\u002Fstop><\u002FlinearGradient>\n      <linearGradient id=\"gl\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n        <stop offset=\"0\" stop-color=\"rgba(198,163,90,0)\"><\u002Fstop><stop offset=\".5\" stop-color=\"#C6A35A\"><\u002Fstop>\n        <stop offset=\"1\" stop-color=\"rgba(198,163,90,0)\"><\u002Fstop><\u002FlinearGradient>\n    <\u002Fdefs>\n    <g font-family=\"JetBrains Mono,monospace\"><g transform=\"translate(0,0)\">\n        <rect x=\"0\" y=\"0\" width=\"700\" height=\"30\" rx=\"2.5\" fill=\"url(#stq)\" stroke=\"rgba(255,255,255,.13)\"><\u002Frect>\n        <rect x=\"1\" y=\"1\" width=\"698\" height=\"1\" fill=\"rgba(220,227,238,.30)\"><\u002Frect>\n        <text x=\"16\" y=\"19\" fill=\"#6B7688\" font-size=\"9\" letter-spacing=\"2.4\">LAYER 0<\u002Ftext>\n        <text x=\"92\" y=\"19\" fill=\"#E9ECF1\" font-size=\"10.5\" font-family=\"Archivo,sans-serif\" font-weight=\"600\">Shared reference frame<\u002Ftext>\n        <text x=\"308\" y=\"19\" fill=\"#9AA7BD\" font-size=\"9.4\">law · payer policy · clinical guidelines<\u002Ftext>\n        <text x=\"686\" y=\"19\" text-anchor=\"end\" fill=\"#0FA6C2\" font-size=\"8.8\">comparable<\u002Ftext>\n      <\u002Fg><g transform=\"translate(0,35)\">\n        <rect x=\"0\" y=\"0\" width=\"700\" height=\"30\" rx=\"2.5\" fill=\"url(#stq)\" stroke=\"rgba(255,255,255,.13)\"><\u002Frect>\n        <rect x=\"1\" y=\"1\" width=\"698\" height=\"1\" fill=\"rgba(220,227,238,.30)\"><\u002Frect>\n        <text x=\"16\" y=\"19\" fill=\"#6B7688\" font-size=\"9\" letter-spacing=\"2.4\">LAYER 1<\u002Ftext>\n        <text x=\"92\" y=\"19\" fill=\"#E9ECF1\" font-size=\"10.5\" font-family=\"Archivo,sans-serif\" font-weight=\"600\">SOPs &amp; job description<\u002Ftext>\n        <text x=\"308\" y=\"19\" fill=\"#9AA7BD\" font-size=\"9.4\">the audit process · what the role delivers<\u002Ftext>\n        <text x=\"686\" y=\"19\" text-anchor=\"end\" fill=\"#0FA6C2\" font-size=\"8.8\">repeatable<\u002Ftext>\n      <\u002Fg><g transform=\"translate(0,58)\">\n        <rect x=\"0\" y=\"0\" width=\"700\" height=\"30\" rx=\"2.5\" fill=\"url(#stq)\" stroke=\"rgba(255,255,255,.13)\"><\u002Frect>\n        <rect x=\"1\" y=\"1\" width=\"698\" height=\"1\" fill=\"rgba(220,227,238,.30)\"><\u002Frect>\n        <text x=\"16\" y=\"19\" fill=\"#6B7688\" font-size=\"9\" letter-spacing=\"2.4\">LAYER 2<\u002Ftext>\n        <text x=\"92\" y=\"19\" fill=\"#E9ECF1\" font-size=\"10.5\" font-family=\"Archivo,sans-serif\" font-weight=\"600\">Data pipeline<\u002Ftext>\n        <text x=\"308\" y=\"19\" fill=\"#9AA7BD\" font-size=\"9.4\">Roving Doctors Portal → Excel folder → Power BI dashboard<\u002Ftext>\n        <text x=\"686\" y=\"19\" text-anchor=\"end\" fill=\"#0FA6C2\" font-size=\"8.8\">countable<\u002Ftext>\n      <\u002Fg><g transform=\"translate(0,105)\">\n        <rect x=\"0\" y=\"0\" width=\"700\" height=\"30\" rx=\"2.5\" fill=\"url(#stq)\" stroke=\"rgba(255,255,255,.13)\"><\u002Frect>\n        <rect x=\"1\" y=\"1\" width=\"698\" height=\"1\" fill=\"rgba(220,227,238,.30)\"><\u002Frect>\n        <text x=\"16\" y=\"19\" fill=\"#6B7688\" font-size=\"9\" letter-spacing=\"2.4\">LAYER 3<\u002Ftext>\n        <text x=\"92\" y=\"19\" fill=\"#E9ECF1\" font-size=\"10.5\" font-family=\"Archivo,sans-serif\" font-weight=\"600\">KPAs → CSFs → metrics<\u002Ftext>\n        <text x=\"308\" y=\"19\" fill=\"#9AA7BD\" font-size=\"9.4\">productivity · efficiency · performance<\u002Ftext>\n        <text x=\"686\" y=\"19\" text-anchor=\"end\" fill=\"#0FA6C2\" font-size=\"8.8\">measured<\u002Ftext>\n      <\u002Fg><g transform=\"translate(0,140)\">\n        <rect x=\"0\" y=\"0\" width=\"700\" height=\"30\" rx=\"2.5\" fill=\"url(#stq)\" stroke=\"rgba(198,163,90,.34)\"><\u002Frect>\n        <rect x=\"1\" y=\"1\" width=\"698\" height=\"1\" fill=\"rgba(198,163,90,.5)\"><\u002Frect>\n        <text x=\"16\" y=\"19\" fill=\"#C6A35A\" font-size=\"9\" letter-spacing=\"2.4\">LAYER 4<\u002Ftext>\n        <text x=\"92\" y=\"19\" fill=\"#E9ECF1\" font-size=\"10.5\" font-family=\"Archivo,sans-serif\" font-weight=\"600\">Competency-based appraisal<\u002Ftext>\n        <text x=\"308\" y=\"19\" fill=\"#9AA7BD\" font-size=\"9.4\">human judgement — outside the arithmetic<\u002Ftext>\n        <text x=\"686\" y=\"19\" text-anchor=\"end\" fill=\"#E6CD92\" font-size=\"8.8\">contestable<\u002Ftext>\n      <\u002Fg>\n    <\u002Fg>\n  <\u002Fsvg>\n  <div class=\"band\" style=\"margin-top:12mm\">\n    <div class=\"ann con\"><span class=\"k\">Concept<\u002Fspan><span class=\"x\">The sequence is the argument. Standardisation is not preparation for measurement — it is what makes measurement mean anything.<\u002Fspan><\u002Fdiv>\n    <div><p>The fifth layer sits deliberately outside the arithmetic. Everything beneath it can be optimised toward; competency-based appraisal cannot — which is what keeps the instrument honest once people begin playing to it.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"foot\"><div class=\"who\">Architecture · the five layers<\u002Fdiv><div class=\"pg\">02 / 08<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section class=\"page\">\n  <div class=\"corner c1\"><\u002Fdiv><div class=\"corner c2\"><\u002Fdiv><div class=\"corner c3\"><\u002Fdiv><div class=\"corner c4\"><\u002Fdiv>\n  <div class=\"hrow\"><div class=\"eyebrow c\">01 &nbsp;—&nbsp; The repository<\u002Fdiv><div class=\"stamp2\">Provenance<\u002Fdiv><\u002Fdiv>\n  <h2>A web, not a filing cabinet<\u002Fh2>\n\n  <div class=\"band\"><div class=\"ann prov\"><span class=\"k\">Provenance<\u002Fspan><span class=\"x\">A case links to its evidence, its provider, its payer, its guideline and its savings category. That is what makes a decision answerable after the fact.<\u002Fspan><\u002Fdiv><div><p>Every element was bound into one OneNote workspace as a network rather than storage. When a saving is <b>contested<\u002Fb>, the answer is retrievable: the case evidence sits in the auditor’s own section, the guideline that justified it in the reference corpus.<\u002Fp><\u002Fdiv><\u002Fdiv>\n\n  <div class=\"cap\" style=\"margin-top:3mm\">Eight sections · 436 MB<\u002Fdiv>\n  <svg viewBox=\"0 0 700 210\" style=\"width:100%;height:auto;margin-bottom:2mm\">\n    <defs>\n      <linearGradient id=\"bar\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n        <stop offset=\"0\" stop-color=\"#8794A8\"><\u002Fstop><stop offset=\"1\" stop-color=\"#3C4859\"><\u002Fstop><\u002FlinearGradient>\n      <linearGradient id=\"bar2\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n        <stop offset=\"0\" stop-color=\"#DCE3EE\"><\u002Fstop><stop offset=\"1\" stop-color=\"#7C8899\"><\u002Fstop><\u002FlinearGradient>\n    <\u002Fdefs>\n    <g font-family=\"JetBrains Mono,monospace\" font-size=\"9.2\"><g transform=\"translate(0,0)\">\n        <text x=\"0\" y=\"11\" fill=\"#E9ECF1\" font-family=\"Archivo,sans-serif\" font-size=\"10.4\" font-weight=\"600\">References<\u002Ftext>\n        <rect x=\"196\" y=\"1\" width=\"404\" height=\"13\" fill=\"url(#bar2)\"><\u002Frect>\n        <text x=\"610\" y=\"11\" fill=\"#DCE3EE\">323 MB<\u002Ftext>\n        <text x=\"0\" y=\"25\" fill=\"#6B7688\" font-size=\"8.6\">clinical guidelines · regulatory law · payer policy<\u002Ftext>\n      <\u002Fg><g transform=\"translate(0,30)\">\n        <text x=\"0\" y=\"11\" fill=\"#E9ECF1\" font-family=\"Archivo,sans-serif\" font-size=\"10.4\" font-weight=\"600\">General Section<\u002Ftext>\n        <rect x=\"196\" y=\"1\" width=\"118\" height=\"13\" fill=\"url(#bar)\"><\u002Frect>\n        <text x=\"324\" y=\"11\" fill=\"#9AA7BD\">94 MB<\u002Ftext>\n        <text x=\"0\" y=\"25\" fill=\"#6B7688\" font-size=\"8.6\">departmental layer · embedded Power BI model<\u002Ftext>\n      <\u002Fg><g transform=\"translate(0,60)\">\n        <text x=\"0\" y=\"11\" fill=\"#E9ECF1\" font-family=\"Archivo,sans-serif\" font-size=\"10.4\" font-weight=\"600\">Auditor dossiers ×4<\u002Ftext>\n        <rect x=\"196\" y=\"1\" width=\"105\" height=\"13\" fill=\"url(#bar)\"><\u002Frect>\n        <text x=\"311\" y=\"11\" fill=\"#9AA7BD\">84 MB<\u002Ftext>\n        <text x=\"0\" y=\"25\" fill=\"#6B7688\" font-size=\"8.6\">source evidence — progress notes, reports, operative notes<\u002Ftext>\n      <\u002Fg><g transform=\"translate(0,90)\">\n        <text x=\"0\" y=\"11\" fill=\"#E9ECF1\" font-family=\"Archivo,sans-serif\" font-size=\"10.4\" font-weight=\"600\">Performance Management<\u002Ftext>\n        <rect x=\"196\" y=\"1\" width=\"22\" height=\"13\" fill=\"url(#bar)\"><\u002Frect>\n        <text x=\"228\" y=\"11\" fill=\"#E6CD92\">17.5 MB<\u002Ftext>\n        <text x=\"0\" y=\"25\" fill=\"#6B7688\" font-size=\"8.6\">KPAs · CSFs · metrics · competency appraisal<\u002Ftext>\n      <\u002Fg><g transform=\"translate(0,120)\">\n        <text x=\"0\" y=\"11\" fill=\"#E9ECF1\" font-family=\"Archivo,sans-serif\" font-size=\"10.4\" font-weight=\"600\">Auditing Process<\u002Ftext>\n        <rect x=\"196\" y=\"1\" width=\"21\" height=\"13\" fill=\"url(#bar)\"><\u002Frect>\n        <text x=\"227\" y=\"11\" fill=\"#9AA7BD\">16.8 MB<\u002Ftext>\n        <text x=\"0\" y=\"25\" fill=\"#6B7688\" font-size=\"8.6\">the method — how a case is worked<\u002Ftext>\n      <\u002Fg><g transform=\"translate(0,150)\">\n        <text x=\"0\" y=\"11\" fill=\"#E9ECF1\" font-family=\"Archivo,sans-serif\" font-size=\"10.4\" font-weight=\"600\">Archived Cases<\u002Ftext>\n        <rect x=\"196\" y=\"1\" width=\"4\" height=\"13\" fill=\"url(#bar)\"><\u002Frect>\n        <text x=\"210\" y=\"11\" fill=\"#9AA7BD\">2.4 MB<\u002Ftext>\n        <text x=\"0\" y=\"25\" fill=\"#6B7688\" font-size=\"8.6\">closed cases, retrievable by file number<\u002Ftext>\n      <\u002Fg><g transform=\"translate(0,180)\">\n        <text x=\"0\" y=\"11\" fill=\"#E9ECF1\" font-family=\"Archivo,sans-serif\" font-size=\"10.4\" font-weight=\"600\">Database · Pre-auth<\u002Ftext>\n        <rect x=\"196\" y=\"1\" width=\"3\" height=\"13\" fill=\"url(#bar)\"><\u002Frect>\n        <text x=\"209\" y=\"11\" fill=\"#9AA7BD\">1.8 MB<\u002Ftext>\n        <text x=\"0\" y=\"25\" fill=\"#6B7688\" font-size=\"8.6\">provider network · payer list · savings taxonomy<\u002Ftext>\n      <\u002Fg>\n    <\u002Fg>\n  <\u002Fsvg>\n\n  <div class=\"cap\">887 case records · each with payer, provider, region, amount, date and a written clinical rationale<\u002Fdiv>\n  <div style=\"display:flex;gap:2.6mm;margin-bottom:3mm\"><div class=\"steel\" style=\"flex:1;padding:3.6mm 3mm;text-align:center\"><div class=\"num\" style=\"font-size:9pt;color:#DCE3EE\">Misuse<\u002Fdiv><\u002Fdiv><div class=\"steel\" style=\"flex:1;padding:3.6mm 3mm;text-align:center\"><div class=\"num\" style=\"font-size:9pt;color:#DCE3EE\">Abuse / Overutilisation<\u002Fdiv><\u002Fdiv><div class=\"steel\" style=\"flex:1;padding:3.6mm 3mm;text-align:center\"><div class=\"num\" style=\"font-size:9pt;color:#DCE3EE\">Fraud<\u002Fdiv><\u002Fdiv><div class=\"steel\" style=\"flex:1;padding:3.6mm 3mm;text-align:center\"><div class=\"num\" style=\"font-size:9pt;color:#DCE3EE\">Cost avoidance<\u002Fdiv><\u002Fdiv><div class=\"steel\" style=\"flex:1;padding:3.6mm 3mm;text-align:center\"><div class=\"num\" style=\"font-size:9pt;color:#DCE3EE\">Uncovered service<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"cap\">Provenance — every figure re-derived from these artefacts<\u002Fdiv>\n  <div class=\"prov steel\">\n    <table class=\"pv\">\n      <thead><tr><th style=\"width:31%\">Ground-truth artefact<\u002Fth><th style=\"width:17%\">Role<\u002Fth><th style=\"width:11%\">Bytes<\u002Fth><th style=\"width:21%\">Modified<\u002Fth><th style=\"width:20%\">SHA-256<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td>Roving Doctors Department — Metrics.xlsx<\u002Ftd><td>daily register · 6 sheets<\u002Ftd>\n            <td>310,031<\u002Ftd><td>2024-06-05<\u002Ftd><td class=\"h\">c1bdb96c06b0d193<\u002Ftd><\u002Ftr>\n        <tr><td>Roving Doctors Department Dashboard.pbix<\u002Ftd><td>command centre<\u002Ftd>\n            <td>1,522,167<\u002Ftd><td>2024-03-17&nbsp;<span class=\"ib\">internal<\u002Fspan><\u002Ftd><td class=\"h\">4aa19d1b09eb61fa<\u002Ftd><\u002Ftr>\n        <tr><td>Roving Doctors — Deliverables (2024-06-04).xlsx<\u002Ftd><td>data pool · case level<\u002Ftd>\n            <td>1,800,739<\u002Ftd><td>2024-06-04<\u002Ftd><td class=\"h\">36493df4bcde125f<\u002Ftd><\u002Ftr>\n        <tr><td>Performance Management Process.one<\u002Ftd><td>KPAs · CSFs · appraisal<\u002Ftd>\n            <td>17,528,851<\u002Ftd><td>2026-06-19<\u002Ftd><td class=\"h\">b06e7a08bc8fe750<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n    <div class=\"stamp\">\n      <span>Derived <b>22 August 2026<\u002Fb> — read from the source workbooks and notebook, not from any summary sheet or prior report. Two copies of the deliverables workbook survive and only the dated one is intact — the copy under the plain name is cut to 111 rows and has lost the February register entirely.<\u002Fspan>\n      <span class=\"v\">VERIFIED<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"foot\">\n    <div class=\"who\">The repository &nbsp;·&nbsp; OneNote workspace<\u002Fdiv>\n    <div class=\"pg\">03 / 08<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"corner c1\"><\u002Fdiv><div class=\"corner c2\"><\u002Fdiv><div class=\"corner c3\"><\u002Fdiv><div class=\"corner c4\"><\u002Fdiv>\n  <div class=\"hrow\"><div class=\"eyebrow\">02 &nbsp;—&nbsp; The measurement layer<\u002Fdiv><div class=\"stamp2\">Constrained<\u002Fdiv><\u002Fdiv>\n  <h2>Two measures that constrain each other<\u002Fh2>\n\n  <svg viewBox=\"0 0 700 236\" style=\"width:100%;height:auto;margin-bottom:5mm\">\n    <defs>\n      <linearGradient id=\"sb\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n        <stop offset=\"0\" stop-color=\"#35435A\"><\u002Fstop><stop offset=\".32\" stop-color=\"#2A3648\"><\u002Fstop>\n        <stop offset=\".7\" stop-color=\"#171D26\"><\u002Fstop><stop offset=\"1\" stop-color=\"#0C1015\"><\u002Fstop><\u002FlinearGradient>\n      <linearGradient id=\"gl2\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n        <stop offset=\"0\" stop-color=\"rgba(198,163,90,0)\"><\u002Fstop><stop offset=\".5\" stop-color=\"#C6A35A\"><\u002Fstop>\n        <stop offset=\"1\" stop-color=\"rgba(198,163,90,0)\"><\u002Fstop><\u002FlinearGradient>\n    <\u002Fdefs>\n    <rect x=\"230\" y=\"2\" width=\"240\" height=\"50\" rx=\"3\" fill=\"url(#sb)\" stroke=\"rgba(255,255,255,.16)\"><\u002Frect>\n    <rect x=\"231\" y=\"3\" width=\"238\" height=\"1\" fill=\"rgba(220,227,238,.34)\"><\u002Frect>\n    <text x=\"350\" y=\"23\" text-anchor=\"middle\" fill=\"#DCE3EE\" font-family=\"JetBrains Mono,monospace\" font-size=\"9.4\" letter-spacing=\"2.8\">PERFORMANCE SCORE<\u002Ftext>\n    <text x=\"350\" y=\"41\" text-anchor=\"middle\" fill=\"#9AA7BD\" font-family=\"JetBrains Mono,monospace\" font-size=\"10\">average ( P , E )<\u002Ftext>\n    <path d=\"M350 52 L350 70 M160 70 L540 70 M160 70 L160 88 M540 70 L540 88\" stroke=\"rgba(255,255,255,.18)\" fill=\"none\"><\u002Fpath>\n\n    <rect x=\"18\" y=\"88\" width=\"284\" height=\"126\" rx=\"3\" fill=\"rgba(255,255,255,.026)\" stroke=\"rgba(255,255,255,.09)\"><\u002Frect>\n    <rect x=\"19\" y=\"89\" width=\"282\" height=\"1\" fill=\"rgba(255,255,255,.12)\"><\u002Frect>\n    <text x=\"36\" y=\"109\" fill=\"#0FA6C2\" font-family=\"JetBrains Mono,monospace\" font-size=\"8.4\" letter-spacing=\"2.4\">FROM KPAs<\u002Ftext>\n    <text x=\"36\" y=\"129\" fill=\"#E9ECF1\" font-family=\"Archivo,sans-serif\" font-size=\"14\" font-weight=\"600\">Productivity<\u002Ftext>\n    <line x1=\"36\" y1=\"138\" x2=\"284\" y2=\"138\" stroke=\"rgba(255,255,255,.09)\"><\u002Fline>\n    <text x=\"36\" y=\"154\" fill=\"#C4CCDF\" font-family=\"JetBrains Mono,monospace\" font-size=\"9.2\">01 Reports · roving visits<\u002Ftext>\n    <text x=\"36\" y=\"168\" fill=\"#C4CCDF\" font-family=\"JetBrains Mono,monospace\" font-size=\"9.2\">02 Cases with savings<\u002Ftext>\n    <text x=\"36\" y=\"182\" fill=\"#C4CCDF\" font-family=\"JetBrains Mono,monospace\" font-size=\"9.2\">03 Engagement<\u002Ftext>\n    <text x=\"36\" y=\"196\" fill=\"#C4CCDF\" font-family=\"JetBrains Mono,monospace\" font-size=\"9.2\">04 Pre-authorisation <tspan fill=\"#6B7688\">(2024)<\u002Ftspan><\u002Ftext>\n\n    <rect x=\"398\" y=\"88\" width=\"284\" height=\"126\" rx=\"3\" fill=\"rgba(255,255,255,.026)\" stroke=\"rgba(255,255,255,.09)\"><\u002Frect>\n    <rect x=\"399\" y=\"89\" width=\"282\" height=\"1\" fill=\"rgba(255,255,255,.12)\"><\u002Frect>\n    <text x=\"416\" y=\"109\" fill=\"#0FA6C2\" font-family=\"JetBrains Mono,monospace\" font-size=\"8.4\" letter-spacing=\"2.4\">FROM CSFs<\u002Ftext>\n    <text x=\"416\" y=\"129\" fill=\"#E9ECF1\" font-family=\"Archivo,sans-serif\" font-size=\"14\" font-weight=\"600\">Efficiency<\u002Ftext>\n    <line x1=\"416\" y1=\"138\" x2=\"664\" y2=\"138\" stroke=\"rgba(255,255,255,.09)\"><\u002Fline>\n    <text x=\"416\" y=\"154\" fill=\"#C4CCDF\" font-family=\"JetBrains Mono,monospace\" font-size=\"9.2\">01 Savings cases ÷ reported<\u002Ftext>\n    <text x=\"416\" y=\"168\" fill=\"#C4CCDF\" font-family=\"JetBrains Mono,monospace\" font-size=\"9.2\">02 Non-GOSI ÷ total savings<\u002Ftext>\n    <text x=\"416\" y=\"186\" fill=\"#9AA7BD\" font-family=\"Archivo,sans-serif\" font-size=\"9.6\">Difficulty weighting — GOSI was over-utilised<\u002Ftext>\n    <text x=\"416\" y=\"199\" fill=\"#9AA7BD\" font-family=\"Archivo,sans-serif\" font-size=\"9.6\">by default; non-GOSI took real argument.<\u002Ftext>\n\n    <rect x=\"0\" y=\"222\" width=\"700\" height=\"1\" fill=\"url(#gl2)\"><\u002Frect>\n    <text x=\"350\" y=\"235\" text-anchor=\"middle\" fill=\"#C6A35A\" font-family=\"JetBrains Mono,monospace\" font-size=\"8.6\" letter-spacing=\"3\">COMPETENCY-BASED APPRAISAL — OUTSIDE THE FORMULA<\u002Ftext>\n  <\u002Fsvg>\n\n  <div class=\"band\"><div class=\"ann con\"><span class=\"k\">Concept<\u002Fspan><span class=\"x\">Two terms, one ratio. The correction survives; the redundancy does not.<\u002Fspan><\u002Fdiv><div><div class=\"steel\" style=\"padding:4.6mm 5.2mm;margin-bottom:3.5mm\"><div class=\"cap\" style=\"color:#9AA7BD;margin-bottom:2.6mm\">Efficiency — as written in the register<\u002Fdiv><div class=\"num\" style=\"font-size:12pt;color:#DCE3EE\">E &nbsp;=&nbsp; ( <span style=\"color:#0FA6C2\">S<\u002Fspan> ÷ <span style=\"color:#0FA6C2\">R<\u002Fspan> ) &nbsp;×&nbsp; ( <span style=\"color:#0FA6C2\">N<\u002Fspan> ÷ <span style=\"color:#0FA6C2\">S<\u002Fspan> )<\u002Fdiv><\u002Fdiv><div style=\"border-left:2px solid var(--cyan);background:rgba(15,166,194,.055);padding:3.6mm 4.4mm\"><div class=\"num\" style=\"font-size:12.5pt;color:#DCE3EE\">( S ÷ R ) × ( N ÷ S ) &nbsp;<span style=\"color:#6B7688\">≡<\u002Fspan>&nbsp; <span style=\"color:#E6CD92\">N ÷ R<\u002Fspan><\u002Fdiv><p style=\"font-size:9.4pt;color:var(--ink3);margin-top:2.4mm\">The savings-case term cancels. R is the reports submitted, one per case, which is how the caseload was counted — so what is scored is non-GOSI savings cases ÷ reports. Verified on every row: <span class=\"num\">53÷239 = 0.221757<\u002Fspan>, <span class=\"num\">90÷547 = 0.164534<\u002Fspan>. The GOSI count sits in the register beside it and never enters the arithmetic.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n  <div class=\"band\"><div class=\"ann con\"><span class=\"k\">Concept<\u002Fspan><span class=\"x\">An average, not a weighting — so neither component can be discarded.<\u002Fspan><\u002Fdiv><div><div class=\"steel\" style=\"padding:4.6mm 5.2mm\"><div class=\"cap\" style=\"color:#9AA7BD;margin-bottom:2.4mm\">Final score<\u002Fdiv><div class=\"num\" style=\"font-size:12pt;color:#DCE3EE\">Score &nbsp;=&nbsp; average ( Productivity , Efficiency )<\u002Fdiv><p style=\"font-size:9.6pt;color:#9AA7BD;margin-top:2.8mm;padding-top:2.6mm;border-top:1px solid rgba(255,255,255,.10)\">Productivity is the <b>sum<\u002Fb> of four subsets. Each subset is divided by the highest raw figure in that cycle, so whoever leads a subset scores exactly <b>1<\u002Fb> and everyone else is a fraction of them. Four subsets, ceiling 4. The two halves of the score carry equal weight.<\u002Fp><div class=\"cap\" style=\"margin-top:3.4mm;margin-bottom:1.8mm\">Worked — February 2024, each column scaled to its own leader<\u002Fdiv><table><thead><tr><th>Auditor<\u002Fth><th>Reports<\u002Fth><th>Pre-auth<\u002Fth><th>Engage<\u002Fth><th>Sav. cases<\u002Fth><th>Sum<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>Mohammed Almikhlafi<\u002Ftd><td class=\"hi\">1.000<\u002Ftd><td>0.278<\u002Ftd><td class=\"hi\">1.000<\u002Ftd><td>0.591<\u002Ftd><td>2.869<\u002Ftd><\u002Ftr><tr><td>Ibrahim Tolba<\u002Ftd><td>0.517<\u002Ftd><td class=\"hi\">1.000<\u002Ftd><td>0.497<\u002Ftd><td class=\"hi\">1.000<\u002Ftd><td>3.014<\u002Ftd><\u002Ftr><tr><td>Mohammad Al-Baloushi<\u002Ftd><td>0.437<\u002Ftd><td>0.409<\u002Ftd><td>0.166<\u002Ftd><td>0.415<\u002Ftd><td>1.426<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><p style=\"font-size:9.6pt;color:#9AA7BD;margin-top:2.4mm\">The savings amount in riyals enters neither measure, by choice. Scoring on savings alone would have steered the team toward savings alone — never the objective.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n  <div class=\"foot\">\n    <div class=\"who\">Measurement layer &nbsp;·&nbsp; KPAs → CSFs → score<\u002Fdiv>\n    <div class=\"pg\">04 / 08<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page pout\">\n  <div class=\"corner c1\"><\u002Fdiv><div class=\"corner c2\"><\u002Fdiv><div class=\"corner c3\"><\u002Fdiv><div class=\"corner c4\"><\u002Fdiv>\n  <div class=\"hrow\"><div class=\"eyebrow\">03 &nbsp;—&nbsp; Departmental output<\u002Fdiv><div class=\"stamp2\">Re-derived<\u002Fdiv><\u002Fdiv>\n  <h2>2023 — the year, and 2024 — the instrument<\u002Fh2>\n\n  <div class=\"band\"><div class=\"ann val\"><span class=\"fig\">SR 20M<\u002Fspan><span class=\"k\">Value<\u002Fspan><span class=\"x\">The departmental scoreboard for 2023: SR 20M saved, 7,195 roving visits, 2,913 lives touched. The four auditors below account for 18,931,845 and 6,478 of those; the balance is my own caseload — 209 cases and SAR 2,064,000 across 20 hospitals, 76% of it non-GOSI, carried unasked while the department was being built. 2023 is the outcome; the instrument itself ran on the 2024 cycles below, monitored live in Power BI.<\u002Fspan><\u002Fdiv><div><table><thead><tr><th>Auditor<\u002Fth><th>Savings (SAR)<\u002Fth><th>Reports &amp; visits<\u002Fth><th>Engagement<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>Ibrahim Tolba<\u002Ftd><td class=\"hi\">14,056,133<\u002Ftd><td>2,768<\u002Ftd><td>478<\u002Ftd><\u002Ftr><tr><td>Mohammad Al-Baloushi<\u002Ftd><td>2,549,818<\u002Ftd><td>2,090<\u002Ftd><td>430<\u002Ftd><\u002Ftr><tr><td>Mohammed Almikhlafi<\u002Ftd><td>1,991,501<\u002Ftd><td>868<\u002Ftd><td class=\"hi\">1,524<\u002Ftd><\u002Ftr><tr><td>Mohamed Abdelrahman Elamin<\u002Ftd><td>334,393<\u002Ftd><td>752<\u002Ftd><td>481<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><div class=\"tnote\">Elamin’s figures cover a partial year — he relocated to the United States mid-cycle. Saleh and Mohammed Baabad were withdrawn to cover a pre-authorisation shortfall — Saleh in January 2023, the month the department was declared.<br>Records run to <b style=\"color:#E6CD92\">March 2024<\u002Fb> — I was on leave from mid-March and left the department in April 2024.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n  <div class=\"cap\" style=\"margin-top:2mm\">Contribution shape — each measure scaled to its own maximum<\u002Fdiv>\n  <svg viewBox=\"0 0 700 136\" style=\"width:100%;height:auto;margin-bottom:2mm\">\n    <defs>\n      <linearGradient id=\"p1\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#DCE3EE\"><\u002Fstop><stop offset=\"1\" stop-color=\"#8B95A5\"><\u002Fstop><\u002FlinearGradient>\n      <linearGradient id=\"p2\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#7E8A9C\"><\u002Fstop><stop offset=\"1\" stop-color=\"#3E4B63\"><\u002Fstop><\u002FlinearGradient>\n      <linearGradient id=\"p3\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#0FA6C2\"><\u002Fstop><stop offset=\"1\" stop-color=\"#0A6C7F\"><\u002Fstop><\u002FlinearGradient>\n    <\u002Fdefs>\n    <g font-family=\"JetBrains Mono,monospace\" font-size=\"8.8\" fill=\"#9AA7BD\">\n      <rect x=\"0\" y=\"0\" width=\"11\" height=\"9\" fill=\"url(#p1)\"><\u002Frect><text x=\"17\" y=\"8\">Savings<\u002Ftext>\n      <rect x=\"92\" y=\"0\" width=\"11\" height=\"9\" fill=\"url(#p2)\"><\u002Frect><text x=\"109\" y=\"8\">Reports &amp; visits<\u002Ftext>\n      <rect x=\"232\" y=\"0\" width=\"11\" height=\"9\" fill=\"url(#p3)\"><\u002Frect><text x=\"249\" y=\"8\">Engagement<\u002Ftext>\n    <\u002Fg><g transform=\"translate(0,18)\">\n        <text x=\"0\" y=\"10\" fill=\"#E9ECF1\" font-family=\"Archivo,sans-serif\" font-size=\"10.2\" font-weight=\"600\">Ibrahim Tolba<\u002Ftext>\n        <rect x=\"186\" y=\"1\" width=\"430\" height=\"9\" fill=\"url(#p1)\"><\u002Frect>\n        <rect x=\"186\" y=\"13\" width=\"430\" height=\"9\" fill=\"url(#p2)\"><\u002Frect>\n        <rect x=\"186\" y=\"25\" width=\"135\" height=\"9\" fill=\"url(#p3)\"><\u002Frect>\n        <text x=\"686\" y=\"20\" text-anchor=\"end\" fill=\"#6B7688\" font-size=\"8.6\">savings + volume<\u002Ftext>\n      <\u002Fg><g transform=\"translate(0,58)\">\n        <text x=\"0\" y=\"10\" fill=\"#E9ECF1\" font-family=\"Archivo,sans-serif\" font-size=\"10.2\" font-weight=\"600\">Mohammad Al-Baloushi<\u002Ftext>\n        <rect x=\"186\" y=\"1\" width=\"78\" height=\"9\" fill=\"url(#p1)\"><\u002Frect>\n        <rect x=\"186\" y=\"13\" width=\"325\" height=\"9\" fill=\"url(#p2)\"><\u002Frect>\n        <rect x=\"186\" y=\"25\" width=\"121\" height=\"9\" fill=\"url(#p3)\"><\u002Frect>\n        <text x=\"686\" y=\"20\" text-anchor=\"end\" fill=\"#6B7688\" font-size=\"8.6\">report-led<\u002Ftext>\n      <\u002Fg><g transform=\"translate(0,98)\">\n        <text x=\"0\" y=\"10\" fill=\"#E9ECF1\" font-family=\"Archivo,sans-serif\" font-size=\"10.2\" font-weight=\"600\">Mohammed Almikhlafi<\u002Ftext>\n        <rect x=\"186\" y=\"1\" width=\"61\" height=\"9\" fill=\"url(#p1)\"><\u002Frect>\n        <rect x=\"186\" y=\"13\" width=\"135\" height=\"9\" fill=\"url(#p2)\"><\u002Frect>\n        <rect x=\"186\" y=\"25\" width=\"430\" height=\"9\" fill=\"url(#p3)\"><\u002Frect>\n        <text x=\"686\" y=\"20\" text-anchor=\"end\" fill=\"#6B7688\" font-size=\"8.6\">engagement-led<\u002Ftext>\n      <\u002Fg>\n  <\u002Fsvg>\n\n  <div class=\"band\"><div class=\"ann con\"><span class=\"k\">Concept<\u002Fspan><span class=\"x\">A single number ranks one of them first and explains nothing. Territory ranks them before the metric ever does.<\u002Fspan><\u002Fdiv><div><p>Three auditors, three entirely different shapes of contribution — and the largest of them shaped by ground as much as by effort. <b>91%<\u002Fb> of Tolba’s cases and <b>96%<\u002Fb> of his value come from two Riyadh hospitals, and 93% of his savings cases are GOSI, the portfolio that took the least argument. My own 209 run across 20 hospitals and are 76% non-GOSI. The riyal figure measures the territory before it measures the auditor, which is why it scores nothing.<\u002Fp><\u002Fdiv><\u002Fdiv>\n\n  <div class=\"cap\" style=\"margin-top:2.4mm\">The measured cycles — January and February 2024<\u002Fdiv>\n  <div class=\"cyc-tables\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:5mm\">\n    <div>\n      <div class=\"cap\" style=\"margin-bottom:1.4mm;color:var(--ink3)\">January 2024<\u002Fdiv>\n      <table>\n        <thead><tr><th>Auditor<\u002Fth><th>Reports<\u002Fth><th>Pre-auth<\u002Fth><th>Engage<\u002Fth><th>Sav. cases<\u002Fth><th>Non-GOSI<\u002Fth><th>Score<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Ibrahim Tolba<\u002Ftd><td>124<\u002Ftd><td>76<\u002Ftd><td>92<\u002Ftd><td>51<\u002Ftd><td>14<\u002Ftd><td class=\"hi\">7.140<\u002Ftd><\u002Ftr>\n          <tr><td>Mohammed Almikhlafi<\u002Ftd><td>269<\u002Ftd><td>44<\u002Ftd><td>174<\u002Ftd><td>29<\u002Ftd><td>26<\u002Ftd><td class=\"hi\">6.407<\u002Ftd><\u002Ftr>\n          <tr><td>Mohammad Al-Baloushi<\u002Ftd><td>112<\u002Ftd><td>40<\u002Ftd><td>37<\u002Ftd><td>29<\u002Ftd><td>8<\u002Ftd><td class=\"hi\">4.433<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n    <div>\n      <div class=\"cap\" style=\"margin-bottom:1.4mm;color:var(--ink3)\">February 2024<\u002Fdiv>\n      <table>\n        <thead><tr><th>Auditor<\u002Fth><th>Reports<\u002Fth><th>Pre-auth<\u002Fth><th>Engage<\u002Fth><th>Sav. cases<\u002Fth><th>Non-GOSI<\u002Fth><th>Score<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Ibrahim Tolba<\u002Ftd><td>283<\u002Ftd><td>230<\u002Ftd><td>171<\u002Ftd><td>176<\u002Ftd><td>59<\u002Ftd><td class=\"hi\">1.6115<\u002Ftd><\u002Ftr>\n          <tr><td>Mohammed Almikhlafi<\u002Ftd><td>547<\u002Ftd><td>64<\u002Ftd><td>344<\u002Ftd><td>104<\u002Ftd><td>90<\u002Ftd><td class=\"hi\">1.5169<\u002Ftd><\u002Ftr>\n          <tr><td>Mohammad Al-Baloushi<\u002Ftd><td>239<\u002Ftd><td>94<\u002Ftd><td>57<\u002Ftd><td>73<\u002Ftd><td>53<\u002Ftd><td class=\"hi\">0.8239<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tnote\">The two cycles are not on one scale — January multiplies efficiency by 100 and February does not, which is finding 04 overleaf. Read each cycle against itself. Al-Baloushi is last in both.<\u002Fdiv>\n\n  <div class=\"foot\">\n    <div class=\"who\">Output &nbsp;·&nbsp; re-derived from the source workbook<\u002Fdiv>\n    <div class=\"pg\">05 / 08<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"corner c1\"><\u002Fdiv><div class=\"corner c2\"><\u002Fdiv><div class=\"corner c3\"><\u002Fdiv><div class=\"corner c4\"><\u002Fdiv>\n  <div class=\"hrow\"><div class=\"eyebrow\">04 &nbsp;—&nbsp; Audit of the instrument<\u002Fdiv><div class=\"stamp2\">Structural<\u002Fdiv><\u002Fdiv>\n  <h2>Five findings from a byte-level review<\u002Fh2>\n\n  <div class=\"band\"><div class=\"ann prov\"><span class=\"k\">Provenance<\u002Fspan><span class=\"x\">Figures re-derived from the source workbook, not read from its summary sheet. Two structural properties, three recording errors.<\u002Fspan><\u002Fdiv><div><p>An instrument that has never been audited is a claim, not a measurement.<\u002Fp><\u002Fdiv><\u002Fdiv>\n\n  <div class=\"glass\" style=\"padding:3.4mm 5mm;margin:2.6mm 0 3mm\">\n    <div class=\"find\"><div class=\"idx\">01<\u002Fdiv><div>\n      <h3>Efficiency reduces to a single ratio <span class=\"sev\">Structural<\u002Fspan><\u002Fh3>\n      <p>The savings-case term cancels; the metric is non-GOSI savings cases ÷ reports submitted. The GOSI count is recorded beside it and never weighted — the two-denominator form the design called for needed a split of the caseload by payer group that the register never captured. One GOSI cell does not reconcile either: 54 beside 53 non-GOSI on 73 savings cases, where 20 is the figure that balances.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div class=\"find\"><div class=\"idx\">02<\u002Fdiv><div>\n      <h3>A productivity cell held another auditor’s value <span class=\"sev a\">Corrected<\u002Fspan><\u002Fh3>\n      <p>Al-Baloushi’s productivity was stored as 0.21203421, the value sitting in Tolba’s efficiency cell. His four factors sum to 1.42605685. The stray figure is wrong in both places — Tolba’s February efficiency is 59÷283 = 0.208481, which is what puts him at 1.6115.<\u002Fp>\n      <span class=\"ev\">performance 0.2169 → <b>0.8239<\u002Fb><\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"find\"><div class=\"idx\">03<\u002Fdiv><div>\n      <h3>A reported-case count was stored as text <span class=\"sev a\">Corrected<\u002Fspan><\u002Fh3>\n      <p>Entered as the string “66 + 203”; efficiency consumed 66 and discarded 203. Productivity was normalised against the true 269, so the defect sits in one half of the score only — and correcting it moves Almikhlafi from first to second on that cycle.<\u002Fp>\n      <span class=\"ev\">efficiency 39.39% → <b>9.67%<\u002Fb><\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"find\"><div class=\"idx\">04<\u002Fdiv><div>\n      <h3>Two sheets scaled efficiency differently <span class=\"sev a\">Corrected<\u002Fspan><\u002Fh3>\n      <p>One multiplied by 100 and one did not — inverting which measure dominates, and the ranking with it. Each cycle was exported as its own copy of the graphs for the appraisal meeting, which is how two scales came to coexist unnoticed.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div class=\"find\"><div class=\"idx\">05<\u002Fdiv><div>\n      <h3>Scores are cycle-relative <span class=\"sev\">Structural<\u002Fspan><\u002Fh3>\n      <p>Normalisation is against the strongest performer that cycle. This kept measurement fair while the team\n      contracted, and prevents comparison across cycles without re-basing.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"cap\">Finding 04 — the same formula, opposite behaviour<\u002Fdiv>\n  <svg viewBox=\"0 0 700 108\" style=\"width:100%;height:auto\">\n    <rect x=\"0\" y=\"0\" width=\"336\" height=\"108\" rx=\"3\" fill=\"rgba(255,255,255,.026)\" stroke=\"rgba(255,255,255,.09)\"><\u002Frect>\n    <text x=\"18\" y=\"22\" fill=\"#6B7688\" font-family=\"JetBrains Mono,monospace\" font-size=\"8.4\" letter-spacing=\"2\">EFFICIENCY × 100<\u002Ftext>\n    <text x=\"18\" y=\"40\" fill=\"#C4CCDF\" font-family=\"Archivo,sans-serif\" font-size=\"10\">Efficiency drives 80–93%<\u002Ftext>\n    <g transform=\"translate(18,50)\">\n      <rect x=\"0\" y=\"0\" width=\"300\" height=\"13\" fill=\"#202936\"><\u002Frect>\n      <rect x=\"0\" y=\"0\" width=\"258\" height=\"13\" fill=\"#8794A8\"><\u002Frect>\n      <text x=\"6\" y=\"10\" fill=\"#0C1015\" font-family=\"JetBrains Mono,monospace\" font-size=\"8.4\">EFFICIENCY<\u002Ftext>\n    <\u002Fg>\n    <text x=\"18\" y=\"86\" fill=\"#9AA7BD\" font-family=\"JetBrains Mono,monospace\" font-size=\"9.2\">Almikhlafi 21.27 &nbsp;›&nbsp; Tolba 7.14<\u002Ftext>\n    <text x=\"18\" y=\"100\" fill=\"#6B7688\" font-family=\"JetBrains Mono,monospace\" font-size=\"8.4\">January 2024 cycle<\u002Ftext>\n\n    <rect x=\"364\" y=\"0\" width=\"336\" height=\"108\" rx=\"3\" fill=\"rgba(255,255,255,.026)\" stroke=\"rgba(255,255,255,.09)\"><\u002Frect>\n    <text x=\"382\" y=\"22\" fill=\"#6B7688\" font-family=\"JetBrains Mono,monospace\" font-size=\"8.4\" letter-spacing=\"2\">EFFICIENCY UNSCALED<\u002Ftext>\n    <text x=\"382\" y=\"40\" fill=\"#C4CCDF\" font-family=\"Archivo,sans-serif\" font-size=\"10\">Productivity drives 87–95%<\u002Ftext>\n    <g transform=\"translate(382,50)\">\n      <rect x=\"0\" y=\"0\" width=\"300\" height=\"13\" fill=\"#202936\"><\u002Frect>\n      <rect x=\"0\" y=\"0\" width=\"27\" height=\"13\" fill=\"#8794A8\"><\u002Frect>\n      <text x=\"34\" y=\"10\" fill=\"#9AA7BD\" font-family=\"JetBrains Mono,monospace\" font-size=\"8.4\">PRODUCTIVITY<\u002Ftext>\n    <\u002Fg>\n    <text x=\"382\" y=\"86\" fill=\"#E6CD92\" font-family=\"JetBrains Mono,monospace\" font-size=\"9.2\">Tolba 1.6115 &nbsp;›&nbsp; Almikhlafi 1.5169<\u002Ftext>\n    <text x=\"382\" y=\"100\" fill=\"#6B7688\" font-family=\"JetBrains Mono,monospace\" font-size=\"8.4\">February 2024 cycle<\u002Ftext>\n  <\u002Fsvg>\n\n  <div class=\"foot\">\n    <div class=\"who\">Audit &nbsp;·&nbsp; two structural properties, three recording errors<\u002Fdiv>\n    <div class=\"pg\">06 / 08<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"corner c1\"><\u002Fdiv><div class=\"corner c2\"><\u002Fdiv><div class=\"corner c3\"><\u002Fdiv><div class=\"corner c4\"><\u002Fdiv>\n  <div class=\"hrow\"><div class=\"eyebrow\">05 &nbsp;—&nbsp; Appraisal, contest, revision<\u002Fdiv><div class=\"stamp2\">Closes on author<\u002Fdiv><\u002Fdiv>\n  <h2>The loop closes on its author<\u002Fh2>\n\n  <div class=\"band\"><div class=\"ann cyc\"><span class=\"k\">Cycle<\u002Fspan><span class=\"x\">The score steers. It does not appraise. Judgement stays with a person, and that person is answerable too.<\u002Fspan><\u002Fdiv><div><div class=\"glass-deep\" style=\"padding:4.4mm 5mm\"><p>Final evaluation ran through a <b>competency-based framework<\u002Fb> — working, leading and inspiring results, adapting and growing. A physician on a GOSI-heavy Riyadh caseload and one on a mixed Jeddah portfolio are not facing the same instrument, and no coefficient settles that.<\u002Fp><p style=\"margin-top:3mm\">The form put the auditor first. Each completed a <b>self-assessment before the meeting<\u002Fb> — what they achieved, what they intended next, and <i>what additional support they needed to succeed<\u002Fi>. Only then did I respond, and disagreement obliged me to write the reason. That last question is what made the loop close on me: their answer assessed the training I had provided.<\u002Fp><div class=\"dims\"><span>Territory &amp; payer mix<\u002Fspan><span>Assigned vs chosen caseload<\u002Fspan><span>Operational constraints<\u002Fspan><span>Skill trajectory<\u002Fspan><span>Tenure<\u002Fspan><span>Training received<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n  <div class=\"cap\" style=\"margin-top:5mm\">The closed loop<\u002Fdiv>\n  <svg viewBox=\"-3 0 706 146\" style=\"width:100%;height:auto;margin-bottom:4.5mm\">\n    <defs>\n      <linearGradient id=\"retn\" x1=\"1\" y1=\"0\" x2=\"0\" y2=\"0\">\n        <stop offset=\"0\" stop-color=\"rgba(198,163,90,.14)\"><\u002Fstop><stop offset=\".24\" stop-color=\"#C6A35A\"><\u002Fstop>\n        <stop offset=\".76\" stop-color=\"#C6A35A\"><\u002Fstop><stop offset=\"1\" stop-color=\"rgba(198,163,90,.14)\"><\u002Fstop><\u002FlinearGradient>\n      <linearGradient id=\"lp\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n        <stop offset=\"0\" stop-color=\"#35435A\"><\u002Fstop><stop offset=\".7\" stop-color=\"#171D26\"><\u002Fstop>\n        <stop offset=\"1\" stop-color=\"#0C1015\"><\u002Fstop><\u002FlinearGradient>\n    <\u002Fdefs>\n    <g font-family=\"JetBrains Mono,monospace\" font-size=\"9\"><g transform=\"translate(0,26)\">\n        <rect x=\"0\" y=\"0\" width=\"118\" height=\"42\" rx=\"2.5\" fill=\"url(#lp)\" stroke=\"rgba(255,255,255,.13)\"><\u002Frect>\n        <rect x=\"1\" y=\"1\" width=\"116\" height=\"1\" fill=\"rgba(220,227,238,.30)\"><\u002Frect>\n        <text x=\"59\" y=\"26\" text-anchor=\"middle\" fill=\"#DCE3EE\">TRAINING<\u002Ftext>\n      <\u002Fg><path d=\"M124 47 L142 47\" stroke=\"rgba(255,255,255,.22)\"><\u002Fpath><path d=\"M136 43 L142 47 L136 51\" fill=\"none\" stroke=\"rgba(255,255,255,.22)\"><\u002Fpath><g transform=\"translate(146,26)\">\n        <rect x=\"0\" y=\"0\" width=\"118\" height=\"42\" rx=\"2.5\" fill=\"url(#lp)\" stroke=\"rgba(255,255,255,.13)\"><\u002Frect>\n        <rect x=\"1\" y=\"1\" width=\"116\" height=\"1\" fill=\"rgba(220,227,238,.30)\"><\u002Frect>\n        <text x=\"59\" y=\"26\" text-anchor=\"middle\" fill=\"#DCE3EE\">PERFORMANCE<\u002Ftext>\n      <\u002Fg><path d=\"M270 47 L288 47\" stroke=\"rgba(255,255,255,.22)\"><\u002Fpath><path d=\"M282 43 L288 47 L282 51\" fill=\"none\" stroke=\"rgba(255,255,255,.22)\"><\u002Fpath><g transform=\"translate(292,26)\">\n        <rect x=\"0\" y=\"0\" width=\"118\" height=\"42\" rx=\"2.5\" fill=\"url(#lp)\" stroke=\"rgba(255,255,255,.13)\"><\u002Frect>\n        <rect x=\"1\" y=\"1\" width=\"116\" height=\"1\" fill=\"rgba(220,227,238,.30)\"><\u002Frect>\n        <text x=\"59\" y=\"26\" text-anchor=\"middle\" fill=\"#DCE3EE\">MEASUREMENT<\u002Ftext>\n      <\u002Fg><path d=\"M416 47 L434 47\" stroke=\"rgba(255,255,255,.22)\"><\u002Fpath><path d=\"M428 43 L434 47 L428 51\" fill=\"none\" stroke=\"rgba(255,255,255,.22)\"><\u002Fpath><g transform=\"translate(438,26)\">\n        <rect x=\"0\" y=\"0\" width=\"118\" height=\"42\" rx=\"2.5\" fill=\"url(#lp)\" stroke=\"rgba(255,255,255,.13)\"><\u002Frect>\n        <rect x=\"1\" y=\"1\" width=\"116\" height=\"1\" fill=\"rgba(220,227,238,.30)\"><\u002Frect>\n        <text x=\"59\" y=\"26\" text-anchor=\"middle\" fill=\"#DCE3EE\">APPRAISAL<\u002Ftext>\n      <\u002Fg><path d=\"M562 47 L580 47\" stroke=\"#C6A35A\"><\u002Fpath><path d=\"M574 43 L580 47 L574 51\" fill=\"none\" stroke=\"#C6A35A\"><\u002Fpath><g transform=\"translate(584,26)\">\n        <rect x=\"0\" y=\"0\" width=\"118\" height=\"42\" rx=\"2.5\" fill=\"url(#lp)\" stroke=\"rgba(198,163,90,.42)\"><\u002Frect>\n        <rect x=\"1\" y=\"1\" width=\"116\" height=\"1\" fill=\"rgba(198,163,90,.5)\"><\u002Frect>\n        <text x=\"59\" y=\"26\" text-anchor=\"middle\" fill=\"#E6CD92\">CONTEST<\u002Ftext>\n      <\u002Fg>\n      <path d=\"M643 72 L643 102 Q643 108 637 108 L65 108 Q59 108 59 102 L59 76\" fill=\"none\" stroke=\"url(#retn)\" stroke-width=\"1.2\"><\u002Fpath>\n      <path d=\"M55 82 L59 74 L63 82\" fill=\"none\" stroke=\"#C6A35A\" stroke-width=\"1.1\"><\u002Fpath>\n      <text x=\"350\" y=\"126\" text-anchor=\"middle\" fill=\"#C6A35A\" font-size=\"8.8\" letter-spacing=\"2.4\">REVISION — OF THE INSTRUMENT, AND OF THE TRAINING BEHIND IT<\u002Ftext>\n      <text x=\"350\" y=\"142\" text-anchor=\"middle\" fill=\"#6B7688\" font-size=\"8.6\">evidence in the dossiers · guideline in the corpus · both retrievable<\u002Ftext>\n    <\u002Fg>\n  <\u002Fsvg>\n\n  <div class=\"band\"><div class=\"ann cyc\"><span class=\"k\">Cycle<\u002Fspan><span class=\"x\">An instrument whose author is exempt from it does not improve. It calcifies.<\u002Fspan><\u002Fdiv><div><h3 style=\"margin-bottom:2mm\">What is contestable<\u002Fh3><p>Not only the auditor’s score. A contested saving is answered from the repository. The appraisal itself — including the training I delivered and the judgement I applied — was open to challenge. Pre-authorisation entering the formula in 2024 is the visible trace: work the department absorbed, made countable rather than left to quietly depress the scores of people already doing it. The same lesson had arrived earlier and gone unrecorded: the role assumed a car and paid nothing for travel, and the first physician to leave was the one who had neither. A SAR 1,500 travel allowance followed, after him. And the auditor who scored highest is the one I never watched work — the instrument was the only sight I had of him, which is the whole reason it had to be contestable.<\u002Fp><\u002Fdiv><\u002Fdiv>\n\n  <div class=\"foot\">\n    <div class=\"who\">Appraisal &nbsp;·&nbsp; the closed loop<\u002Fdiv>\n    <div class=\"pg\">07 / 08<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"corner c1\"><\u002Fdiv><div class=\"corner c2\"><\u002Fdiv><div class=\"corner c3\"><\u002Fdiv><div class=\"corner c4\"><\u002Fdiv>\n  <div class=\"hrow\"><div class=\"eyebrow\">05 &nbsp;—&nbsp; Appraisal, contest, revision<\u002Fdiv><div class=\"stamp2\">Transferable<\u002Fdiv><\u002Fdiv>\n\n  <div style=\"margin:auto 0\">\n  <div class=\"band\"><div class=\"ann val\"><span class=\"k\">Value<\u002Fspan><span class=\"x\">Two years of running it, not foresight.<\u002Fspan><\u002Fdiv><div><div class=\"steel\" style=\"padding:4.4mm 5mm\"><div class=\"cap\" style=\"color:#9AA7BD;margin-bottom:2.4mm\">The engine was learning, not design<\u002Fdiv><p style=\"color:#C4CCDF;font-size:10pt\">Every cycle began with self-evaluation — my own before anyone else’s. That is where the revisions came from. The year taught three things the design did not anticipate: that high visibility of one team’s performance generates organisational friction, and managing it belongs inside the design; that absorbed work must be made countable or it penalises the people already doing it; and that an instrument which stops evolving is one somebody has fully mapped.<\u002Fp><p style=\"color:#C4CCDF;font-size:10pt;margin-top:3mm\">I carried a caseload the whole time, unasked — 209 cases while the department was being built. What I said to the Medical Director was that if I had not worked alongside them, no one would have asked or noticed.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n  <div class=\"band\"><div class=\"ann con\"><span class=\"k\">Concept<\u002Fspan><span class=\"x\">Inter-rater reliability first. Then constraint. Then judgement. Then contest.<\u002Fspan><\u002Fdiv><div><h3 style=\"margin-bottom:2mm\">Where this transfers<\u002Fh3><p>Rubric design for clinical AI meets the same sequence. No evaluation is meaningful until assessors share a reference frame. Accuracy, safety and calibration must constrain one another rather than sum into one figure. Case mix must be corrected for, not rewarded. Expert judgement sits outside the computed score. And the rubric, with whoever authored it, stays open to contest — or it stops describing what it was built to measure.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n<div class=\"foot\">\n    <div class=\"who\">Dr. Sherif Alattar &nbsp;·&nbsp; Total Care Saudi &nbsp;·&nbsp; 2022–2024<\u002Fdiv>\n    <div class=\"pg\">08 / 08<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<button class=\"tw-toggle\" id=\"twToggle\">Tweaks<\u002Fbutton>\n<div class=\"tweaks-panel\" id=\"tweaksPanel\">\n  <div class=\"tw-head\">Tweaks<\u002Fdiv>\n  <div class=\"tw-group\">\n    <div class=\"tw-label\">Palette<\u002Fdiv>\n    <div class=\"tw-seg\" data-key=\"palette\">\n      <button data-val=\"midnight\">Midnight<\u002Fbutton>\n      <button data-val=\"warm\">Warm Signal<\u002Fbutton>\n      <button data-val=\"contrast\">High Contrast<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tw-group\">\n    <div class=\"tw-label\">Card material<\u002Fdiv>\n    <div class=\"tw-seg\" data-key=\"cards\">\n      <button data-val=\"glass\">Glass<\u002Fbutton>\n      <button data-val=\"forged\">Forged Steel<\u002Fbutton>\n      <button data-val=\"outline\">Dossier Outline<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tw-group\">\n    <div class=\"tw-label\">Layout<\u002Fdiv>\n    <div class=\"tw-seg\" data-key=\"density\">\n      <button data-val=\"standard\">Standard<\u002Fbutton>\n      <button data-val=\"spacious\">Spacious<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<script>\n(function(){\n  var root=document.documentElement;\n  var DEF={palette:'midnight',cards:'glass',density:'standard'};\n  Object.keys(DEF).forEach(function(k){\n    var v=localStorage.getItem('pms-tweak-'+k)||DEF[k];\n    if(v!==DEF[k]) root.setAttribute('data-'+k,v);\n    document.querySelectorAll('.tw-seg[data-key=\"'+k+'\"] button').forEach(function(b){\n      if(b.dataset.val===v) b.classList.add('on');\n      b.addEventListener('click',function(){\n        document.querySelectorAll('.tw-seg[data-key=\"'+k+'\"] button').forEach(function(x){x.classList.remove('on')});\n        b.classList.add('on');\n        if(b.dataset.val===DEF[k]) root.removeAttribute('data-'+k);\n        else root.setAttribute('data-'+k,b.dataset.val);\n        localStorage.setItem('pms-tweak-'+k,b.dataset.val);\n      });\n    });\n  });\n  var tg=document.getElementById('twToggle'), pn=document.getElementById('tweaksPanel');\n  tg.addEventListener('click',function(){pn.classList.toggle('open')});\n  document.addEventListener('click',function(e){\n    if(pn.classList.contains('open') && !pn.contains(e.target) && e.target!==tg) pn.classList.remove('open');\n  });\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
